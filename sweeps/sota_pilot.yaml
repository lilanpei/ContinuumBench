  config: configs/eo_small.yaml
  overrides:
    placement:
      strategy: min_latency
      place_every_epochs: 2
- name: eo_t0_best_fit
  controller: best_fit
  config: configs/eo_small.yaml
  overrides: {}
- name: eo_t0_round_robin
  controller: round_robin
  config: configs/eo_small.yaml
  overrides: {}
- name: eo_t0_cost_greedy
  controller: placement_only:cost_greedy
  config: configs/eo_small.yaml
  overrides: {}
- name: eo_t0_learned_stub
  controller: learned_stub
  config: configs/eo_small.yaml
  overrides: &id001
    placement:
      strategy: min_latency
      place_every_epochs: 2
- name: eo_t0_rl_meta
