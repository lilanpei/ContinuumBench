name: sota_pilot
config: configs/eo_small.yaml
seeds:
- 0
- 1
- 2
overrides:
  epochs: 80
  drain_epochs: 40
  workload:
    repeat: true
  infrastructure:
    contact_schedule:
      repeat: true
runs:
- name: eo_t0_joint
  controller: separated_loops
  config: configs/eo_small.yaml
  overrides:
    placement:
      strategy: min_latency
      place_every_epochs: 2
- name: eo_t0_hpa
  controller: hpa
  config: configs/eo_small.yaml
  overrides:
    placement:
      strategy: min_latency
      place_every_epochs: 2
- name: eo_t0_keda
