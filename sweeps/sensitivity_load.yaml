name: sensitivity_load
config: configs/eo_trace_small.yaml
seeds:
- 0
- 1
- 2
overrides:
  epochs: 120
  drain_epochs: 60
  workload:
    repeat: true
  infrastructure:
    contact_schedule:
      repeat: true
runs:
- name: eo_load_low_joint
  controller: separated_loops
  config: configs/eo_trace_small.yaml
  overrides:
    workload:
      streams:
        SpaceSource:
          generator: piecewise
          segments:
          - epochs: 10
            rate: 0.48
          - epochs: 15
            rate: 1.56
          - epochs: 15
            rate: 0.66
        IoTSource:
          generator: piecewise
          segments:
          - epochs: 20
            rate: 1.2
          - epochs: 10
            rate: 2.1
          - epochs: 10
            rate: 0.96
    placement:
      strategy: min_latency
      place_every_epochs: 2
- name: eo_load_low_hpa
