name: sensitivity_contact
config: configs/eo_trace_small.yaml
seeds:
- 0
- 1
- 2
overrides:
  epochs: 120
  drain_epochs: 60
  workload:
    repeat: true
  infrastructure:
    contact_schedule:
      repeat: true
runs:
- name: eo_contact_mild_joint
  controller: separated_loops
  config: configs/eo_trace_small.yaml
  overrides: &eo_mild
    infrastructure:
      contact_schedule:
        path: src/continuum_bench/calibration/contact_traces/eo_space_ground_mild.csv
        repeat: true
    placement:
      strategy: min_latency
      place_every_epochs: 2
- name: eo_contact_mild_hpa
  controller: hpa
  config: configs/eo_trace_small.yaml
  overrides: *eo_mild
- name: eo_contact_mild_keda
  controller: keda
  config: configs/eo_trace_small.yaml
  overrides: *eo_mild
- name: eo_contact_mild_best_fit
  controller: best_fit
  config: configs/eo_trace_small.yaml
  overrides: &eo_mild_static
    infrastructure:
      contact_schedule:
        path: src/continuum_bench/calibration/contact_traces/eo_space_ground_mild.csv
        repeat: true
- name: eo_contact_mild_learned_stub
  controller: learned_stub
  config: configs/eo_trace_small.yaml
  overrides: *eo_mild
- name: eo_contact_mild_rl_meta
  controller: rl_meta
  config: configs/eo_trace_small.yaml
  overrides: *eo_mild
- name: eo_contact_base_joint
  controller: separated_loops
  config: configs/eo_trace_small.yaml
  overrides: &place_min_latency
    placement:
      strategy: min_latency
      place_every_epochs: 2
- name: eo_contact_base_hpa
  controller: hpa
  config: configs/eo_trace_small.yaml
  overrides: *place_min_latency
- name: eo_contact_base_keda
  controller: keda
  config: configs/eo_trace_small.yaml
  overrides: *place_min_latency
- name: eo_contact_base_best_fit
  controller: best_fit
  config: configs/eo_trace_small.yaml
  overrides: {}
- name: eo_contact_base_learned_stub
  controller: learned_stub
  config: configs/eo_trace_small.yaml
  overrides: *place_min_latency
- name: eo_contact_base_rl_meta
  controller: rl_meta
  config: configs/eo_trace_small.yaml
  overrides: *place_min_latency
- name: eo_contact_stress_joint
  controller: separated_loops
  config: configs/eo_trace_small.yaml
  overrides: &eo_stress
    infrastructure:
      contact_schedule:
        path: src/continuum_bench/calibration/contact_traces/eo_space_ground_stress.csv
        repeat: true
    placement:
      strategy: min_latency
      place_every_epochs: 2
- name: eo_contact_stress_hpa
  controller: hpa
  config: configs/eo_trace_small.yaml
  overrides: *eo_stress
- name: eo_contact_stress_keda
  controller: keda
  config: configs/eo_trace_small.yaml
  overrides: *eo_stress
- name: eo_contact_stress_best_fit
  controller: best_fit
  config: configs/eo_trace_small.yaml
  overrides: &eo_stress_static
    infrastructure:
      contact_schedule:
        path: src/continuum_bench/calibration/contact_traces/eo_space_ground_stress.csv
        repeat: true
- name: eo_contact_stress_learned_stub
  controller: learned_stub
  config: configs/eo_trace_small.yaml
  overrides: *eo_stress
- name: eo_contact_stress_rl_meta
  controller: rl_meta
  config: configs/eo_trace_small.yaml
  overrides: *eo_stress

- name: driving_contact_mild_joint
  controller: separated_loops
  config: configs/driving_trace_small.yaml
