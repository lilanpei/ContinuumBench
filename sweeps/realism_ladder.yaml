name: realism_ladder
config: configs/eo_small.yaml
seeds:
- 0
- 1
- 2
overrides:
  epochs: 120
  drain_epochs: 60
  workload:
    repeat: true
runs:
- name: eo_t0_joint
  controller: separated_loops
  config: configs/eo_small.yaml
  overrides:
    realism_tier: T0
    placement:
      strategy: min_latency
      place_every_epochs: 2
- name: eo_t0_hpa
  controller: hpa
  config: configs/eo_small.yaml
  overrides:
    realism_tier: T0
    placement:
      strategy: min_latency
      place_every_epochs: 2
- name: eo_t0_keda
  controller: keda
  config: configs/eo_small.yaml
  overrides:
    realism_tier: T0
    placement:
      strategy: min_latency
      place_every_epochs: 2
- name: eo_t0_best_fit
  controller: best_fit
  config: configs/eo_small.yaml
  overrides:
    realism_tier: T0
- name: eo_t0_round_robin
  controller: round_robin
  config: configs/eo_small.yaml
  overrides:
    realism_tier: T0
- name: eo_t0_cost_greedy
  controller: placement_only:cost_greedy
  config: configs/eo_small.yaml
  overrides: &id001
    realism_tier: T0
- name: eo_t0_milp
  controller: placement_only:milp
  config: configs/eo_small.yaml
  overrides: *id001
- name: eo_t0_learned_stub
  controller: learned_stub
  config: configs/eo_small.yaml
  overrides: &id002
    realism_tier: T0
    placement:
      strategy: min_latency
      place_every_epochs: 2
- name: eo_t0_rl_meta
