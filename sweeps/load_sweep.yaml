# Finding 2 of the ContinuumBench paper: the load sweep under R1.
# 4 scenarios x 4 arrival-rate factors (0.6x to 2.0x) x 6 controllers x 5 seeds = 480 runs.
# Analyze with: python analysis/findings.py load --sweep-dir runs/load_sweep
name: load_sweep
config: configs/eo_small.yaml
seeds:
- 0
- 1
- 2
- 3
- 4
overrides:
  epochs: 120
  drain_epochs: 60
  workload:
    repeat: true
  infrastructure:
    contact_schedule:
      repeat: true
runs:
- name: eo_L060_hpa
  controller: hpa
  config: configs/eo_small.yaml
  overrides:
    workload: &id001
      streams:
        SpaceSource:
          generator: piecewise
          segments:
          - epochs: 10
            rate: 0.48
          - epochs: 15
            rate: 1.8
          - epochs: 15
            rate: 0.6
        IoTSource:
          generator: piecewise
          segments:
          - epochs: 20
            rate: 1.2
          - epochs: 10
            rate: 2.4
          - epochs: 10
            rate: 0.9
    placement:
      strategy: min_latency
- name: eo_L060_keda
  controller: keda
  config: configs/eo_small.yaml
  overrides:
    workload: *id001
    placement:
      strategy: min_latency
- name: eo_L060_sep
  controller: separated_loops
  config: configs/eo_small.yaml
  overrides:
    workload: *id001
    placement:
      strategy: min_latency
- name: eo_L060_static_minlat
  controller: placement_only:min_latency
  config: configs/eo_small.yaml
  overrides:
    workload: *id001
    placement:
      strategy: min_latency
- name: eo_L060_milp_ref
  controller: placement_only:milp
  config: configs/eo_small.yaml
  overrides:
    workload: *id001
    placement:
      strategy: min_latency
- name: eo_L060_ceiling
  controller: no_scaling
  config: configs/eo_small.yaml
  overrides:
    workload: *id001
    placement:
      strategy: min_latency
    scaling:
      pools:
        BulkPath:
          min_workers: 4
          initial_workers: 4
          max_workers: 4
- name: eo_L100_hpa
  controller: hpa
  config: configs/eo_small.yaml
  overrides:
    workload: &id002
      streams:
        SpaceSource:
          generator: piecewise
          segments:
          - epochs: 10
            rate: 0.8
          - epochs: 15
            rate: 3.0
          - epochs: 15
            rate: 1.0
        IoTSource:
          generator: piecewise
          segments:
          - epochs: 20
            rate: 2.0
          - epochs: 10
            rate: 4.0
          - epochs: 10
            rate: 1.5
    placement:
