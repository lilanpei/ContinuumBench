# Finding 1 of the ContinuumBench paper: the re-planning ablation.
# 24 configurations x three placement schedules (coupled, periodic, fixed) x 5 seeds = 360 runs.
# Analyze with: python analysis/findings.py replan --sweep-dir runs/replan_ablation
name: replan_ablation
config: configs/eo_small.yaml
seeds:
- 0
- 1
- 2
- 3
- 4
