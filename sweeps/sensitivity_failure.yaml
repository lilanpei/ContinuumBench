name: sensitivity_failure
config: configs/eo_small.yaml
seeds:
- 0
- 1
- 2
overrides:
  epochs: 120
  drain_epochs: 60
  workload:
    repeat: true
  infrastructure:
    contact_schedule:
      repeat: true
runs:
- name: eo_failure_none_joint
  controller: separated_loops
  config: configs/eo_small.yaml
  overrides:
    realism_tier: T2
    reliability:
      failures:
        mode: disabled
        node_failure_probability: 0.0
    placement:
      strategy: min_latency
      place_every_epochs: 2
- name: eo_failure_none_hpa
  controller: hpa
  config: configs/eo_small.yaml
  overrides:
    realism_tier: T2
    reliability:
      failures:
        mode: disabled
        node_failure_probability: 0.0
    placement:
      strategy: min_latency
      place_every_epochs: 2
- name: eo_failure_none_keda
  controller: keda
  config: configs/eo_small.yaml
  overrides:
    realism_tier: T2
    reliability:
      failures:
        mode: disabled
        node_failure_probability: 0.0
    placement:
      strategy: min_latency
      place_every_epochs: 2
- name: eo_failure_none_best_fit
  controller: best_fit
  config: configs/eo_small.yaml
  overrides:
    realism_tier: T2
    reliability:
      failures:
        mode: disabled
        node_failure_probability: 0.0
- name: eo_failure_none_learned_stub
  controller: learned_stub
  config: configs/eo_small.yaml
  overrides: &id001
    realism_tier: T2
    reliability:
      failures:
        mode: disabled
        node_failure_probability: 0.0
    placement:
      strategy: min_latency
      place_every_epochs: 2
- name: eo_failure_none_rl_meta
  controller: rl_meta
  config: configs/eo_small.yaml
  overrides: *id001
- name: eo_failure_mild_joint
  controller: separated_loops
