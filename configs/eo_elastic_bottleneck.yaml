# Elastic-bottleneck variant of the Earth-observation dual-stream scenario.
#
# The decision is how many workers to run over time. The elastic BulkPath pool is the only
# bottleneck: the fixed stages (Fusion, Triage, FastPath, Sink) are near-instant, and all work
# is routed to the bulk path (priority_prob_high = 0). The load is peaky, a 5 s burst every
# 120 s with a long idle gap, so a static pool sized for the peak is wasteful and one sized for
# the mean misses the burst. The anticipatory autoscaler pre-warms the pool before each burst.

scenario: eo_dual_stream
realism_tier: T0
epochs: 240
step_seconds: 1.0
drain_epochs: 60

scenario_config:
  application_id: EO_ElasticBottleneck

infrastructure:
  infrastructure_id: eo_elastic_infra
  n_space: 1
  n_iot: 2
  n_edge: 2
  n_cloud: 1
  contact_schedule:
    mode: periodic
    period_s: 20
    on_duration_s: 20        # always open: the space link is not a bottleneck
    up_bandwidth_mbps: 400
    down_bandwidth_mbps: 0
    repeat: true

workload:
  repeat: true
  streams:
    SpaceSource:
      generator: piecewise
      segments:
        - epochs: 240
          rate: 0.05           # negligible background
    IoTSource:                 # a 5 s burst at 6 tasks/s every 120 s (peak/mean = 24)
      generator: piecewise
      segments:
        - {epochs: 5,   rate: 6.0}
        - {epochs: 115, rate: 0.0}
        - {epochs: 5,   rate: 6.0}
        - {epochs: 115, rate: 0.0}

stages:
  Fusion:    {processing_time_s: 0.05}   # near-instant, so not a bottleneck
  Triage:    {processing_time_s: 0.05}
  FastPath:  {processing_time_s: 0.05}
  SpaceSource: {priority_prob_high: 0.0} # route everything to the elastic bulk path
  IoTSource:   {priority_prob_high: 0.0}
  Sink:
    processing_time_s: 0.05
    deadline_s: 15.0

scaling:
  pools:
    BulkPath:
      min_workers: 1
      initial_workers: 1
      max_workers: 8
      startup_delay_s: 8.0
  queue_up_threshold: 8
  queue_down_threshold: 2
  age_up_threshold_s: 8
  age_down_threshold_s: 2
  ttl_pressure_up_threshold: 0.25
  ttl_pressure_down_threshold: 0.08
  cooldown_epochs: 1
  scale_step: 3

autoscaling:
  anticipatory:                # pre-warms the pool on the known burst schedule
    period_s: 120
    on_duration_s: 5
    start_offset_s: 0
    lead_s: 10
    drain_s: 18
    prewarm_workers: 6         # about enough to clear a burst within its deadline
    min_replicas: 1

placement:
  strategy: min_latency
  place_every_epochs: 2
