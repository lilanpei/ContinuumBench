scenario: industrial_iot
realism_tier: T4
epochs: 40
step_seconds: 1.0

scenario_config:
  application_id: IndustrialIoTTraceSmall

infrastructure:
  infrastructure_id: industrial_iot_trace_infra
  n_space: 0
  n_iot: 2
  n_edge: 2
  n_cloud: 1

workload:
  streams:
    SensorSource:
      generator: piecewise
      segments:
        - epochs: 10
          rate: 0.9
        - epochs: 10
          rate: 2.0
        - epochs: 10
          rate: 1.3
        - epochs: 10
          rate: 2.4

stages:
  Archive:
    processing_time_s: 0.21
  Sink:
    deadline_s: 10.0

scaling:
  pools:
    BulkArchive:
      min_workers: 0
      initial_workers: 1
      max_workers: 3
  queue_up_threshold: 5
  queue_down_threshold: 2
  age_up_threshold_s: 4
  age_down_threshold_s: 2
  ttl_pressure_up_threshold: 0.15
  ttl_pressure_down_threshold: 0.05
  cooldown_epochs: 1
  scale_step: 1

placement:
  strategy: min_latency
  place_every_epochs: 2

calibration:
  network_profile: edge_cloud_tracebacked_v1
  service_profile_set: industrial_iot_batch_lab_v1
